[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-sync"
description = "Back up your own Strava activities to SQLite and CSV, without the paid API."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Simon Sterneder" }]
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
packages = ["strava_sync"]

[tool.setuptools.dynamic]
version = { attr = "strava_sync.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "RET"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["strava_sync", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
